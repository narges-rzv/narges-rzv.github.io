<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Razavian Lab · NYU Langone</title>
  <meta name="description" content="Razavian Lab at NYU Grossman School of Medicine: machine learning for medicine — EHR, medical imaging, clinical NLP and medical foundation models.">
  <meta property="og:title" content="Razavian Lab · NYU Langone">
  <meta property="og:description" content="Machine learning for medicine — EHR, medical imaging, clinical NLP and medical foundation models.">
  <meta property="og:image" content="https://razavian.net/imgs/narges.jpeg">
  <link rel="icon" href="imgs/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="nav" id="top">
    <div class="wrap nav-inner">
      <a class="brand" href="#top"><span class="brand-mark" aria-hidden="true"></span><span data-bind="lab_name">Razavian Lab</span></a>
      <nav aria-label="Sections">
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#teaching">Teaching</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <div class="hero-text">
        <p class="eyebrow">NYU Grossman School of Medicine · NYU Langone Health</p>
        <h1 data-bind="lab_name">Razavian Lab</h1>
        <p class="tagline" data-bind="tagline"></p>
        <div class="pi">
          <img class="pi-photo" alt="" id="pi-photo">
          <div>
            <div class="pi-name" id="pi-name"></div>
            <div class="pi-title" id="pi-title"></div>
          </div>
        </div>
        <p class="bio" id="pi-bio"></p>
        <div class="pi-links" id="pi-links"></div>
        <dl class="stats" id="stats"></dl>
      </div>
      <div class="hero-collage" id="collage" aria-hidden="true"></div>
    </section>

    <section id="research" class="section">
      <div class="wrap">
        <div class="section-head">
          <h2>Research</h2>
          <p>Select a theme to see its papers.</p>
        </div>
        <div class="themes" id="themes"></div>
      </div>
    </section>

    <section id="publications" class="section alt">
      <div class="wrap">
        <div class="section-head">
          <h2>Publications</h2>
          <p id="pub-updated"></p>
        </div>
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
            <input type="search" id="q" placeholder="Search titles, authors, venues…" aria-label="Search publications">
          </label>
          <select id="year" aria-label="Year"><option value="">All years</option></select>
          <label class="check"><input type="checkbox" id="has-code"> With code</label>
          <label class="check" title="Conference abstracts, patents and technical reports"><input type="checkbox" id="show-other"> Abstracts &amp; patents</label>
        </div>
        <div class="chips" id="topic-chips" role="group" aria-label="Filter by topic"></div>
        <p class="result-count" id="count" aria-live="polite"></p>
        <div id="pubs"></div>
        <div class="more"><button type="button" id="more" class="btn" hidden>Show all</button></div>
      </div>
    </section>

    <section id="teaching" class="section">
      <div class="wrap">
        <div class="section-head"><h2>Teaching</h2></div>
        <div id="teach"></div>
      </div>
    </section>

    <section id="contact" class="section alt">
      <div class="wrap contact">
        <h2>Contact</h2>
        <p id="contact-text"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© <span id="yr"></span> Razavian Lab · NYU Langone Health</span>
      <span id="footer-updated"></span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
