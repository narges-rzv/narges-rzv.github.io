# Site-wide content. Edit on GitHub (pencil icon) — changes go live in ~1 minute.

lab_name: Razavian Lab
tagline: Machine learning for medicine — from health records and medical images to foundation models that help clinicians act earlier.

pi:
  name: Narges Razavian
  title: Associate Professor
  affiliation: Departments of Population Health and Radiology, NYU Grossman School of Medicine
  photo: imgs/narges.jpeg
  bio: >
    Our lab develops machine learning methods that turn routinely collected clinical data —
    electronic health records, clinical notes, radiology and pathology images — into early warnings
    of preventable and undiagnosed disease. We work closely with clinicians at NYU Langone to
    validate and deploy these models, and we are committed to releasing our models and code openly.
  links:
