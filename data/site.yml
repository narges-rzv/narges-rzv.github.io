# Research themes. `id` is what papers are tagged with (automatically, or via data/overrides.yml).
research:
  - id: foundation
    title: Medical Foundation Models
    blurb: Large pretrained models for clinical records, CT, MRI and multimodal data that generalize across tasks and hospitals.
  - id: ehr
    title: EHR & Predictive Analytics
    blurb: Early prediction of preventable and undiagnosed disease from longitudinal electronic health records.
  - id: neuro
    title: Neuroimaging & Dementia
    blurb: Deep learning on brain MRI and CT for Alzheimer's disease, dementia and stroke.
  - id: imaging
    title: Medical Imaging
    blurb: Radiology AI for chest radiographs, head CT and other modalities.
  - id: pathology
    title: Computational Pathology
    blurb: Whole-slide histopathology models for cancer subtyping and mutation prediction.
  - id: nlp
    title: Clinical NLP
    blurb: Language models that read clinical notes for coding, phenotyping and risk prediction.
  - id: trustworthy
    title: Robust & Trustworthy ML
    blurb: Learning with noisy labels, uncertainty, continual learning and fairness in clinical AI.

