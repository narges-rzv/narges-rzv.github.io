    - { label: GitHub, url: "https://github.com/NYUMedML", icon: github }
    - { label: LinkedIn, url: "https://www.linkedin.com/in/narges-razavian-512b7635/", icon: linkedin }
    - { label: NYU Profile, url: "https://med.nyu.edu/faculty/narges-sharif-razavian", icon: link }
    - { label: Email, url: "mailto:narges.razavian@nyulangone.org", icon: mail }

